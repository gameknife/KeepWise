name: tauri-desktop-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/keepwise-tauri/**"
      - "apps/keepwise-tauri/scripts/validate_tauri_desktop_rust_regression.sh"
      - "apps/keepwise-tauri/scripts/validate_tauri_core_diff_regression.sh"
      - "db/migrations/**"
  push:
    branches: [main]
    paths:
      - "apps/keepwise-tauri/**"
      - "apps/keepwise-tauri/scripts/validate_tauri_desktop_rust_regression.sh"
      - "apps/keepwise-tauri/scripts/validate_tauri_core_diff_regression.sh"
      - "db/migrations/**"

jobs:
  desktop-check:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      KEEPWISE_DIFF_REPORT_DIR: ${{ github.workspace }}/.artifacts/tauri-desktop-check

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/keepwise-tauri/package-lock.json"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: apps/keepwise-tauri
        run: npm ci

      - name: Frontend build
        id: frontend_build
        working-directory: apps/keepwise-tauri
        run: npm run build

      - name: Frontend and IPC boundary check
        id: boundary_check
        working-directory: apps/keepwise-tauri
        run: npm run test:boundaries

      - name: Frontend unit tests
        id: frontend_test
        working-directory: apps/keepwise-tauri
        run: npm run test:frontend

      - name: Rust check
        id: rust_check
        working-directory: apps/keepwise-tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust regression subset
        id: rust_regression
        working-directory: apps/keepwise-tauri
        run: npm run test:rust:regression

      - name: Core analytics diff regression
        id: core_diff
        working-directory: apps/keepwise-tauri
        run: npm run test:diff:core

      - name: Write desktop-check regression summary
        if: always()
        run: |
          mkdir -p .artifacts/tauri-desktop-check
          out=".artifacts/tauri-desktop-check/regression_summary.txt"
          diff_path=".artifacts/tauri-desktop-check/core_analytics_diff_regression.json"
          {
            echo "KeepWise Tauri desktop-check regression summary"
            echo "frontend_build_outcome=${FRONTEND_BUILD_OUTCOME:-unknown}"
            echo "boundary_check_outcome=${BOUNDARY_CHECK_OUTCOME:-unknown}"
            echo "frontend_test_outcome=${FRONTEND_TEST_OUTCOME:-unknown}"
            echo "rust_check_outcome=${RUST_CHECK_OUTCOME:-unknown}"
            echo "rust_regression_outcome=${RUST_REGRESSION_OUTCOME:-unknown}"
            echo "core_diff_outcome=${CORE_DIFF_OUTCOME:-unknown}"
            if [[ -f "$diff_path" ]]; then
              echo "core_diff_cases_total=$(jq -r '.summary.cases.total // "n/a"' "$diff_path")"
              echo "core_diff_cases_status_counts=$(jq -c '.summary.cases.status_counts // {}' "$diff_path")"
              echo "core_diff_cross_total=$(jq -r '.summary.cross_case_checks.total // "n/a"' "$diff_path")"
              echo "core_diff_cross_status_counts=$(jq -c '.summary.cross_case_checks.status_counts // {}' "$diff_path")"
            else
              echo "core_diff_report_missing=1"
            fi
          } > "$out"
          echo "$out"
        env:
          FRONTEND_BUILD_OUTCOME: ${{ steps.frontend_build.outcome }}
          BOUNDARY_CHECK_OUTCOME: ${{ steps.boundary_check.outcome }}
          FRONTEND_TEST_OUTCOME: ${{ steps.frontend_test.outcome }}
          RUST_CHECK_OUTCOME: ${{ steps.rust_check.outcome }}
          RUST_REGRESSION_OUTCOME: ${{ steps.rust_regression.outcome }}
          CORE_DIFF_OUTCOME: ${{ steps.core_diff.outcome }}

      - name: Write desktop-check artifact manifest
        if: always()
        run: |
          mkdir -p .artifacts/tauri-desktop-check
          {
            echo "workflow=tauri-desktop-check"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "created_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .artifacts/tauri-desktop-check/manifest.txt

      - name: Upload desktop-check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-check-artifacts
          path: .artifacts/tauri-desktop-check
          if-no-files-found: warn
